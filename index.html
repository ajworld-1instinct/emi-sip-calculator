r:#585254}.languages{display:flex;gap:10px;margin-top:24px}button,input,select{font:inherit;border:1px solid #aaa;border-radius:5px;background:white;color:#251f21;min-height:46px}button{padding:10px 16px;cursor:pointer}button[aria-pressed=true],button.primary{background:#dcece6;border-color:#73a89a;font-weight:600}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #39796a;outline-offset:3px}section{border-top:1px solid #eae9ea;margin-top:30px;padding-top:28px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:24px 0}label{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600}input,select{width:100%;padding:9px 10px}input:invalid:not(:focus){border-color:#aaa}.results{background:#f7f8f7;margin-top:20px;padding:18px;border-radius:8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.results span{display:block;font-size:13px;color:#585254}.results strong{display:block;font-size:23px;overflow-wrap:anywhere;font-weight:600}.results:empty{display:none}.error{color:#9d2020;font-size:14px}.error:empty{display:none}footer{border-top:1px solid #eae9ea;margin-top:30px;padding-top:20px}@media(max-width:650px){main{padding:24px;margin:0;border-radius:0}h1{font-size:30px}h2{font-size:24px}.fields,.results{grid-template-columns:1fr}.results{gap:18px}.results strong{font-size:24px}button.primary{width:100%}}
</style><title>EMI and SIP, clearly</title></head><body><main>
<header><p class="eyebrow">AJ World Services · <span data-en="Offline calculation tool" data-te="ఆఫ్‌లైన్ లెక్కల సాధనం"></span></p><h1 data-en="EMI and SIP, clearly" data-te="EMI, SIP లెక్కలు సులభంగా"></h1><p data-en="Explore the numbers. No accounts, ads, tracking or payments." data-te="లెక్కలు చూసుకోండి. ఖాతాలు, ప్రకటనలు, ట్రాకింగ్ లేదా చెల్లింపులు లేవు."></p><div class="languages" aria-label="Language"><button id="en" type="button" aria-pressed="true">English</button><button id="te" type="button" aria-pressed="false">తెలుగు</button></div></header>
<p id="offline" class="status" role="status"></p>
<section aria-labelledby="emi-heading"><h2 id="emi-heading" data-en="Monthly loan payment" data-te="నెలవారీ లోన్ EMI"></h2><p data-en="Fixed rate, monthly reducing balance. Not a lender's quote." data-te="స్థిర వడ్డీ, నెలవారీ తగ్గే బాకీ పద్ధతి. ఇది బ్యాంకు కోట్ కాదు."></p>
<form id="emi-form" novalidate><div class="fields"><label><span data-en="Loan amount (₹)" data-te="రుణం మొత్తం (₹)"></span><input id="principal" type="number" min="1" max="1000000000" step="any" value="100000" required inputmode="decimal"></label><label><span data-en="Annual interest (%)" data-te="వార్షిక వడ్డీ (%)"></span><input id="loan-rate" type="number" min="0" max="60" step="any" value="12" required inputmode="decimal"></label><label><span data-en="Number of months" data-te="నెలల సంఖ్య"></span><input id="loan-months" type="number" min="1" max="600" step="1" value="12" required inputmode="numeric"></label></div><button class="primary" type="submit" data-en="Calculate EMI" data-te="EMI లెక్కించు"></button></form><p id="emi-error" class="error" role="alert"></p><div id="emi-result" class="results" aria-live="polite"></div></section>
<section aria-labelledby="sip-heading"><h2 id="sip-heading" data-en="Monthly SIP illustration" data-te="నెలవారీ SIP అంచనా"></h2><p data-en="A constant-return illustration, not an investment recommendation. Returns can be negative." data-te="ఒకే రాబడి రేటుతో అంచనా మాత్రమే. పెట్టుబడి సలహా కాదు. నష్టాలు రావచ్చు."></p>
<form id="sip-form" novalidate><div class="fields"><label><span data-en="Monthly contribution (₹)" data-te="నెలవారీ పెట్టుబడి (₹)"></span><input id="monthly" type="number" min="1" max="10000000" step="any" value="1000" required inputmode="decimal"></label><label><span data-en="Assumed annual rate (%)" data-te="ఊహించిన వార్షిక రాబడి (%)"></span><input id="sip-rate" type="number" min="0" max="40" step="any" value="12" required inputmode="decimal"></label><label><span data-en="Number of months" data-te="నెలల సంఖ్య"></span><input id="sip-months" type="number" min="1" max="600" step="1" value="12" required inputmode="numeric"></label><label><span data-en="Contribution timing" data-te="పెట్టుబడి సమయం"></span><select id="timing"><option value="end" data-en="End of month" data-te="నెల చివర"></option><option value="start" data-en="Start of month" data-te="నెల ప్రారంభం"></option></select></label></div><button class="primary" type="submit" data-en="Calculate illustration" data-te="అంచనా లెక్కించు"></button></form><p id="sip-error" class="error" role="alert"></p><div id="sip-result" class="results" aria-live="polite"></div></section>
<section><h2 data-en="Know the assumptions" data-te="లెక్కల పరిమితులు"></h2><p data-en="Annual rates are nominal, divided by 12, with monthly periods. EMI excludes fees, taxes, insurance, rate changes and prepayments. SIP excludes taxes, fees and market volatility; the tool accepts non-negative illustration rates only. Displayed rupees are rounded; totals use unrounded values." data-te="వార్షిక రేటును 12తో భాగించి నెలవారీ లెక్కలు చేస్తుంది. EMIలో ఫీజులు, పన్నులు, బీమా, రేటు మార్పులు లేదా ముందస్తు చెల్లింపులు లేవు. SIPలో పన్నులు, ఫీజులు లేదా మార్కెట్ హెచ్చుతగ్గులు లేవు; ఈ సాధనంలో సున్నా లేదా అంతకంటే ఎక్కువ రేటుతో అంచనా మాత్రమే. చూపే రూపాయలు రౌండ్ చేసినవి; మొత్తం లెక్కకు అసలు విలువలు వాడుతుంది."></p><p data-en="Inputs stay in this page's memory and reset on reload. Offline use needs one successful load from localhost or HTTPS. Installation depends on your browser. No external fonts or services are loaded." data-te="మీ వివరాలు ఈ పేజీ మెమరీలోనే ఉంటాయి; రీలోడ్ చేస్తే రీసెట్ అవుతాయి. ఆఫ్‌లైన్‌కు ముందు localhost లేదా HTTPSలో ఒకసారి పేజీ లోడ్ కావాలి. ఇన్‌స్టాల్ అవకాశం మీ బ్రౌజర్‌పై ఆధారపడి ఉంటుంది. బయటి ఫాంట్లు లేదా సేవలు లోడ్ కావు."></p><button id="reset" type="button" data-en="Reset examples" data-te="నమూనాలు రీసెట్ చేయి"></button></section><footer data-en="Free calculator · 16 November 2026 · No ads or earnings enabled" data-te="ఉచిత కాలిక్యులేటర్ · 16 నవంబర్ 2026 · ప్రకటనలు లేదా ఆదాయం ప్రారంభించలేదు"></footer></main><script>(function(root){
'use strict';
function valid(v,min,max,integer=false){return typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max&&(!integer||Number.isInteger(v));}
function emi(p,rate,n){
 if(!valid(p,1,1e9)||!valid(rate,0,60)||!valid(n,1,600,true))throw new Error('invalid');
 const r=rate/1200;
 const payment=r===0?p/n:p*r/(-Math.expm1(-n*Math.log1p(r)));
 const total=payment*n;
 return {payment,total,interest:total-p};
}
function sip(monthly,rate,n,timing='end'){
 if(!valid(monthly,1,1e7)||!valid(rate,0,40)||!valid(n,1,600,true)||!['start','end'].includes(timing))throw new Error('invalid');
 const r=rate/1200;
 const factor=r===0?n:Math.expm1(n*Math.log1p(r))/r;
 const value=monthly*factor*(timing==='start'?1+r:1);
 const invested=monthly*n;
 return {value,invested,growth:value-invested};
}
const api={emi,sip}; if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.AJMath=api;
})(typeof globalThis!=='undefined'?globalThis:this);
</script><script>'use strict';
let lang='en';
const $=id=>document.getElementById(id);
const value=id=>{const s=$(id).value.trim();return s===''?NaN:Number(s)};
const money=x=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(x);
const labels={en:{payment:'Monthly EMI',total:'Total repayment',interest:'Total interest',value:'Illustrated value',invested:'Contributions',growth:'Illustrated growth',emiError:'Enter amount ₹1–100 crore, annual rate 0–60%, and a whole number of months from 1–600.',sipError:'Enter monthly amount ₹1–1 crore, annual rate 0–40%, and a whole number of months from 1–600.',ready:'Offline cache ready. No account or internet needed for these calculations.',loading:'Checking offline availability…',unavailable:'Offline cache not ready. Serve from localhost or HTTPS and reload once.'},te:{payment:'నెలవారీ EMI',total:'మొత్తం తిరిగి చెల్లింపు',interest:'మొత్తం వడ్డీ',value:'అంచనా మొత్తం',invested:'మీ పెట్టుబడి',growth:'అంచనా వృద్ధి',emiError:'మొత్తం ₹1–100 కోట్లు, వార్షిక రేటు 0–60%, నెలలు 1–600 మధ్య పూర్ణసంఖ్య ఇవ్వండి.',sipError:'నెలవారీ మొత్తం ₹1–1 కోటి, వార్షిక రేటు 0–40%, నెలలు 1–600 మధ్య పూర్ణసంఖ్య ఇవ్వండి.',ready:'ఆఫ్‌లైన్ క్యాష్ సిద్ధం. ఈ లెక్కలకు ఖాతా లేదా ఇంటర్నెట్ అవసరం లేదు.',loading:'ఆఫ్‌లైన్ స్థితి చూస్తోంది…',unavailable:'ఆఫ్‌లైన్ క్యాష్ సిద్ధం కాలేదు. localhost లేదా HTTPSలో తెరిచి ఒకసారి రీలోడ్ చేయండి.'}};
let cacheState='loading';
function result(id,items){const box=$(id);box.replaceChildren();for(const [label,n]of items){const d=document.createElement('div'),s=document.createElement('span'),v=document.createElement('strong');s.textContent=label;v.textContent=money(n);d.append(s,v);box.append(d)}}
function calculateEmi(){try{const r=AJMath.emi(value('principal'),value('loan-rate'),value('loan-months'));$('emi-error').textContent='';result('emi-result',[[labels[lang].payment,r.payment],[labels[lang].total,r.total],[labels[lang].interest,r.interest]])}catch(e){$('emi-result').replaceChildren();$('emi-error').textContent=labels[lang].emiError}}
function calculateSip(){try{const r=AJMath.sip(value('monthly'),value('sip-rate'),value('sip-months'),$('timing').value);$('sip-error').textContent='';result('sip-result',[[labels[lang].value,r.value],[labels[lang].invested,r.invested],[labels[lang].growth,r.growth]])}catch(e){$('sip-result').replaceChildren();$('sip-error').textContent=labels[lang].sipError}}
function translate(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('[data-en]').forEach(x=>x.textContent=x.dataset[l]);$('en').setAttribute('aria-pressed',l==='en');$('te').setAttribute('aria-pressed',l==='te');$('offline').textContent=labels[lang][cacheState];calculateEmi();calculateSip()}
$('en').addEventListener('click',()=>translate('en'));$('te').addEventListener('click',()=>translate('te'));
$('emi-form').addEventListener('submit',e=>{e.preventDefault();calculateEmi()});$('sip-form').addEventListener('submit',e=>{e.preventDefault();calculateSip()});$('reset').addEventListener('click',()=>{$('emi-form').reset();$('sip-form').reset();calculateEmi();calculateSip()});
translate('en');
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{cacheState='ready';$('offline').textContent=labels[lang].ready}).catch(()=>{cacheState='unavailable';$('offline').textContent=labels[lang].unavailable})}else{cacheState='unavailable';$('offline').textContent=labels[lang].unavailable}
</script></body></html>
